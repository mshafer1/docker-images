name: Docker build

on:
  # schedule:
  #   - cron: '0 0 * * 0' # weekly at 00:00 on Sunday -> https://crontab.guru/#0_0_*_*_0
  push:
    branches:
      - 'main'
    paths:
      - '**/*'
      - '!docs'
  workflow_dispatch:

env:
  repo_major_minor: '1.1'  # manually update for major.minor changes

jobs:
  set_build_counter:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.set-build-counter.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mshafer1/gh-actions/set-build-counter@53b85ede2023c2cb93f8911f007d80c64095444d # v1.0.0
        id: set-build-counter
        with:
          seed: '${{ env.repo_major_minor }}'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # default GITHUB_TOKEN has no permission to set repo variables, must be a PAT that has variable write
  build_and_push:
    runs-on: ubuntu-latest
    needs: set_build_counter
    strategy:
      matrix:
        app:
          - dnsmasq
          - envsubst
          # - ffmpeg_compile_tools # - disabled for now. I don't need a 30 minute build every time something changes.
    environment: Release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.description="Docker image for ${{ matrix.app }}"
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern=build-{{ env.repo_major_minor }}.{{ needs.set_build_counter.outputs.count }}
            type=semver,pattern=build-{{ env.repo_major_minor }}
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.app }}
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:dev, ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:latest, ${{ steps.meta.outputs.tags }}
      - name: Tag with app version and conditionally push
        run: |
          app_version_command="$(cat ./${{ matrix.app }}/_get_version.sh | grep -e '^#' -v)"
          echo Running version command: $app_version_command
          app_version=$(docker run --entrypoint sh --rm ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:dev -c "${app_version_command}")
          if [ -z "${app_version}" ]; then
            echo "Error, failed to get version from ${{ matrix.app}}"
            exit 1
          fi
          major_app_version=`echo ${app_version} | cut -d'.' -f1`

          decider_version="build-${{ env.repo_major_minor }}_${{ matrix.app }}-${app_version}"

          if ! docker manifest inspect ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:${decider_version} > /dev/null; then
            echo "Tagging with version ${app_version} and pushing"

            for v in ${{ matrix.app }}_${app_version} ${{ matrix.app }}_${major_app_version} ${decider_version}; do
              docker tag ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:dev ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:$v
            done

            # now remove the dev tag so we don't push it
            docker rmi ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}:dev

            docker image push --all-tags ${{ vars.DOCKER_USERNAME }}/${{ matrix.app }}
          else
            echo "Version ${app_version} already pushed"
          fi
